   Keyframe poses for every exercise, built from small parametric generators.
   Pose fields: P pelvis pos · pel/ch/hd [pitch,yaw,roll] · aR/aL arms · lR/lL legs
   Limb spec: {ik:[x,y,z], f:'w'|'c'|'p', pole:[x,y,z]} or {d1:[..], d2:[..]}
   World: +X forward, +Y up, +Z figure's right. Units: cm.
   ========================================================================== */
const Anim = (() => {
  'use strict';
  const HIP_Y = 91.6, ANK = 7.2;
  const R2D = 180 / Math.PI, D2R = Math.PI / 180;
  const base = () => ({ P: [0, HIP_Y, 0], pel: [0, 0, 0], ch: [0, 0, 0], hd: [0, 0, 0],
    aR: { d1: [0.03, -1, 0.15], d2: [0.12, -1, 0.07] }, lR: { ik: [0, ANK, 13] }, f: 'flat', toe: 8 });
  const P = (o) => Object.assign(base(), o);
  // a world direction (dx,dy) expressed in a frame pitched forward by p degrees
  const loc = (dx, dy, p, dz = 0) => { const a = p * D2R; return [dx * Math.cos(a) - dy * Math.sin(a), dx * Math.sin(a) + dy * Math.cos(a), dz]; };
  // pitch that points the spine from point P toward point B (x,y)
  const spineTo = (Pp, Bp) => Math.atan2(Bp[0] - Pp[0], Bp[1] - Pp[1]) * R2D;
  // world (x,y) of a chest-frame point given pelvis pos, pelvis pitch p, chest relative pitch c
  const chestPt = (Pp, p, c, local) => {
    const a = p * D2R, b = (p + c) * D2R;
    const w = [Pp[0] + 20 * Math.sin(a), Pp[1] + 20 * Math.cos(a)];
    return [w[0] + local[1] * Math.sin(b) + local[0] * Math.cos(b), w[1] + local[1] * Math.cos(b) - local[0] * Math.sin(b)];
  };

  // ----- timing -----
  const rep = (ecc = 2, con = 1.1, bot = 0.3, top = 0.45) => [
    { to: 1, t: ecc, ph: 'ecc' }, { to: 1, t: bot, ph: 'hold' }, { to: 0, t: con, ph: 'con' }, { to: 0, t: top, ph: 'hold' }];
  const lift = (con = 1.1, ecc = 1.9, top = 0.35, bot = 0.35) => [
    { to: 1, t: con, ph: 'con' }, { to: 1, t: top, ph: 'hold' }, { to: 0, t: ecc, ph: 'ecc' }, { to: 0, t: bot, ph: 'hold' }];
  const alt = (con = 1, ecc = 1.5, hold = 0.25) => [
    { to: 1, t: con, ph: 'con' }, { to: 1, t: hold, ph: 'hold' }, { to: 0, t: ecc, ph: 'ecc' }, { to: 0, t: 0.2, ph: 'hold' },
    { to: 2, t: con, ph: 'con' }, { to: 2, t: hold, ph: 'hold' }, { to: 0, t: ecc, ph: 'ecc' }, { to: 0, t: 0.2, ph: 'hold' }];
  const iso = (t = 3.2) => [{ to: 1, t: t / 2, ph: 'iso', e: 's' }, { to: 0, t: t / 2, ph: 'iso', e: 's' }];

  // ----- static props -----
  const PAD = '#3b4149', PADS = '#2b3036', LEG = '#4a515a', LEGS = '#3a4048';
  const bench = (x0, x1, top = 45, w = 28, z = 0) => ([
    { t: 'box', c: [(x0 + x1) / 2, top - 4, z], s: [x1 - x0, 8, w], top: PAD, side: PADS },
    { t: 'box', c: [x0 + 10, (top - 8) / 2, z], s: [6, top - 8, w - 6], top: LEG, side: LEGS },
    { t: 'box', c: [x1 - 10, (top - 8) / 2, z], s: [6, top - 8, w - 6], top: LEG, side: LEGS }]);
  // seat + back pad reclined `deg` from vertical; hips at x = hx
  const seatBack = (hx, deg, seatTop = 45, backLen = 78, opts = {}) => {
    const a = deg * D2R;
    const bc = [hx - 13 - Math.sin(a) * backLen / 2, seatTop + 2 + Math.cos(a) * backLen / 2, 0];
    return [
      { t: 'box', c: [hx + (opts.seatX || 6), seatTop - 4, 0], s: [opts.seatLen || 38, 8, 30], top: PAD, side: PADS },
      { t: 'box', c: bc, s: [8, backLen, 28], e: [-deg, 0, 0], top: PAD, side: PADS },
      { t: 'box', c: [hx + 2, (seatTop - 8) / 2, 0], s: [8, seatTop - 8, 20], top: LEG, side: LEGS }];
  };
  const box = (c, s, extra) => Object.assign({ t: 'box', c, s, top: '#40464f', side: '#30353c' }, extra || {});
  const mat = (x0, x1) => ({ t: 'box', c: [(x0 + x1) / 2, 0.6, 0], s: [x1 - x0, 1.2, 64], top: '#363b43', side: '#2a2e34' });
  const pullBar = (y = 212, x = 0) => ([{ t: 'bar', a: [x, y, -64], b: [x, y, 64], r: 1.7 }, { t: 'post', a: [x, y, -66], b: [x, y + 22, -66] }, { t: 'post', a: [x, y, 66], b: [x, y + 22, 66] }]);
  const column = (x, z, h = 215) => ({ t: 'box', c: [x, h / 2, z], s: [14, h, 14], top: '#3d434b', side: '#2c3137' });
  const CH = { db: true, dbAxis: 'neutral' };

  const G = {};

  /* ======================= LOWER BODY ======================= */
  G.squat = (o = {}) => {
    const kind = o.kind || 'back';
    const st = o.stance || 17, depth = o.depth || 50;
    const lean = o.lean !== undefined ? o.lean : (kind === 'back' ? 40 : kind === 'front' ? 22 : kind === 'goblet' ? 26 : 34);
    const back = kind === 'back' ? -19 : kind === 'front' ? -14 : -15;
    const legs = (pole) => ({ lR: { ik: [3, ANK, st], pole: [1, 0, pole] } });
    let a0, a1, props = {};
    if (kind === 'back') { const a = { aR: { ik: [-8, 34.5, 40], f: 'c', pole: [-0.6, -1, 0.35] } }; a0 = a; a1 = a; props = { bar: {} }; }
    else if (kind === 'front') { const a = { aR: { ik: [13, 31.5, 21], f: 'c', pole: [1, 0.25, 0.25] } }; a0 = a; a1 = a; props = { bar: {} }; }
    else if (kind === 'goblet') { const a = { aR: { ik: [17, 21, 4.5], f: 'c', pole: [0.1, -1, 0.5] } }; a0 = a; a1 = a; props = { hold: { k: 'db', ax: 'v' } }; }
    else { a0 = { aR: { d1: [0.25, -1, 0.12], d2: [0.3, -1, 0.05] } }; a1 = { aR: { d1: [1, 0.05, 0.12], d2: [1, 0.05, 0.02] } }; }
    const top = P({ P: [2, 90.4, 0], pel: [6, 0, 0], ...legs(0.3), ...a0, toe: 14 });
    const bot = P({ P: [back, depth, 0], pel: [lean, 0, 0], ch: [-3, 0, 0], hd: [-(lean - 6), 0, 0], ...legs(0.5), ...a1, toe: 14 });
    return { anim: { keys: [top, bot], seq: rep(o.ecc || 2, o.con || 1.2) }, props, cam: [18, 10] };
  };

  G.legPress = () => {
    const Pp = [0, 52, 0], dir = [0.72, 0.69], hip = [0, 52];
    const ank = d => [hip[0] + dir[0] * d, hip[1] + dir[1] * d];
    const mk = d => P({ P: Pp, pel: [-52, 0, 0], ch: [0, 0, 0], hd: [24, 0, 0], lR: { ik: [...ank(d), 15], pole: [1, 0, 0.3] }, f: { rel: 4 }, aR: { ik: [10, 48, 27], pole: [0, -1, 0.4] } });
    const stat = [...seatBack(0, 52, 44, 74, { seatLen: 34 }),
      { t: 'post', a: [30, 18, -32], b: [150, 133, -32], r: 2.6 }, { t: 'post', a: [30, 18, 32], b: [150, 133, 32], r: 2.6 },
      box([88, 9, 0], [150, 18, 70], { top: '#30353c', side: '#262a30' })];
    return { anim: { keys: [mk(80), mk(50)], seq: rep(2, 1.2) }, props: { sled: { off: [6, 0, 0], s: [5, 46, 56], e: [-44, 0, 0] } }, stat, cam: [22, 12] };
  };

  G.lunge = () => {
    const dbs = { aR: { d1: [0.02, -1, 0.16], d2: [0.02, -1, 0.14] } };
    const stand = P({ ...dbs, lR: { ik: [0, ANK, 11] }, toe: 4 });
    const midR = P({ P: [-6, 89, 0], ...dbs, lR: { ik: [-34, 24, 11], pole: [1, -0.2, 0.05] }, lL: { ik: [0, ANK, -11] }, fR: { rel: 20 }, fL: 'flat', toe: 4 });
    const botR = P({ P: [-26, 50, 0], pel: [6, 0, 0], ...dbs, lR: { ik: [-62, 13, 11], pole: [1, -0.3, 0.05] }, lL: { ik: [0, ANK, -11], pole: [1, 0, -0.05] }, fR: 46, fL: 'flat', toe: 4 });
    const midL = P({ P: [-6, 89, 0], ...dbs, lL: { ik: [-34, 24, -11], pole: [1, -0.2, -0.05] }, lR: { ik: [0, ANK, 11] }, fL: { rel: 20 }, fR: 'flat', toe: 4 });
    const botL = P({ P: [-26, 50, 0], pel: [6, 0, 0], ...dbs, lL: { ik: [-62, 13, -11], pole: [1, -0.3, -0.05] }, lR: { ik: [0, ANK, 11], pole: [1, 0, 0.05] }, fL: 46, fR: 'flat', toe: 4 });
    const seq = [
      { to: 1, t: 0.5, ph: 'move' }, { to: 2, t: 0.8, ph: 'ecc' }, { to: 2, t: 0.25, ph: 'hold' }, { to: 1, t: 0.7, ph: 'con' }, { to: 0, t: 0.45, ph: 'move' }, { to: 0, t: 0.3, ph: 'hold' },
      { to: 3, t: 0.5, ph: 'move' }, { to: 4, t: 0.8, ph: 'ecc' }, { to: 4, t: 0.25, ph: 'hold' }, { to: 3, t: 0.7, ph: 'con' }, { to: 0, t: 0.45, ph: 'move' }, { to: 0, t: 0.3, ph: 'hold' }];
    return { anim: { keys: [stand, midR, botR, midL, botL], seq }, props: CH, cam: [16, 8], thumbT: 0.2 };
  };

  G.splitSquat = () => {
    const dbs = { aR: { d1: [0.02, -1, 0.16], d2: [0.02, -1, 0.14] } };
    const legs = { lL: { ik: [30, ANK, -11], pole: [1, 0, -0.08] }, lR: { ik: [-50, 51, 11], pole: [1, -0.4, 0.05] }, fR: { rel: 62 }, fL: 'flat' };
    const top = P({ P: [-4, 84, 0], pel: [6, 0, 0], ...dbs, ...legs });
    const bot = P({ P: [-6, 51, 0], pel: [16, 0, 0], hd: [-10, 0, 0], ...dbs, ...legs });
    return { anim: { keys: [top, bot], seq: rep(2, 1.1) }, props: CH, stat: bench(-78, -28, 47), cam: [14, 8] };
  };

  G.legExt = () => {
    const mk = (sh) => P({ P: [0, 55, 0], pel: [-10, 0, 0], hd: [10, 0, 0], lR: { d1: [1, -0.08, 0.06], d2: sh }, f: { rel: 0 }, aR: { ik: [14, 52, 27], pole: [0, -1, 0.4] } });
    return { anim: { keys: [mk([0.05, -1, 0.03]), mk([1, 0.12, 0.03])], seq: lift(1, 1.8) }, props: { pads: [{ at: 'ankles', side: 'front', arm: 'knee', w: 15 }] }, stat: seatBack(0, 12, 47, 66, { seatLen: 44, seatX: 14 }), cam: [22, 10] };
  };

  G.legCurl = () => {
    const base_ = { P: [-6, 62, 0], pel: [90, 0, 0], ch: [0, 0, 0], hd: [-35, 0, 0], aR: { ik: [62, 54, 20], pole: [1, -0.5, 0.3] }, f: { rel: 18 } };
    const k0 = P({ ...base_, lR: { d1: [0.02, -1, 0.04], d2: [0.02, -1, 0.03] } });
    const k1 = P({ ...base_, lR: { d1: [0.02, -1, 0.04], d2: [-0.94, 0.3, 0.03] } });
    return { anim: { keys: [k0, k1], seq: lift(1, 1.8) }, props: { pads: [{ at: 'ankles', side: 'back', arm: 'knee', w: 15 }] }, stat: [...bench(-60, 78, 50, 30), box([70, 52, 0], [6, 20, 50])], cam: [20, 16] };
  };

  G.stepUp = () => {
    const H = 45;
    const arms = { aR: { d1: [0.04, -1, 0.15], d2: [0.04, -1, 0.13] } };
    const k0 = P({ P: [-14, 87, 0], pel: [14, 0, 0], hd: [-8, 0, 0], lR: { ik: [24, H + ANK, 11], pole: [1, 0, 0.1] }, lL: { ik: [-24, ANK, -11] }, fL: 18, fR: 'flat', ...arms });
    const k1 = P({ P: [20, H + 90, 0], pel: [2, 0, 0], lR: { ik: [24, H + ANK, 11], pole: [1, 0, 0.1] }, lL: { ik: [16, H + 30, -11], pole: [1, 0, 0] }, fL: { rel: 14 }, fR: 'flat', ...arms });
    return { anim: { keys: [k0, k1], seq: lift(1.1, 1.5, 0.4, 0.4) }, props: CH, stat: [box([30, H / 2, 0], [44, H, 52], { bg: false })], cam: [18, 10] };
  };

  G.rdl = (o = {}) => {
    const db = o.db;
    const legs = { lR: { ik: [0, ANK, 13], pole: [1, 0, 0.12] }, toe: 6 };
    const top = P({ P: [-2, 90.8, 0], pel: [-2, 0, 0], ch: [-2, 0, 0], sc: [-1.5, 0], ...legs, aR: { ik: [5, 80, db ? 17 : 22], pole: [-1, 0, 0.3] } });
    const bot = P({ P: [-27, 84, 0], pel: [72, 0, 0], ch: [-4, 0, 0], hd: [-46, 0, 0], sc: [-1, 0], ...legs, aR: { ik: [8, 42, db ? 17 : 22], pole: [-1, 0, 0.3] } });
    return { anim: { keys: [top, bot], seq: rep(2.2, 1.3) }, props: db ? { db: true, dbAxis: 'lat' } : { bar: {} }, cam: [22, 10] };
  };

  G.slRdl = () => {
    const top = P({ lL: { ik: [0, ANK, -9], pole: [1, 0, -0.05] }, lR: { d1: [-0.12, -1, 0.06], d2: [-0.25, -1, 0.04] }, fR: { rel: 20 }, fL: 'flat',
      aR: { d1: [0.04, -1, 0.1], d2: [0.04, -1, 0.08] }, aL: { d1: [0.1, -1, -0.35], d2: [0.1, -1, -0.3] } });
    const bot = P({ P: [-8, 86, 0], pel: [80, 0, 0], ch: [-2, 0, 0], hd: [-50, 0, 0], lL: { ik: [0, ANK, -9], pole: [1, 0, -0.05] }, lR: { d1: [0.04, -1, 0.05], d2: [0.03, -1, 0.04] }, fR: { rel: 18 }, fL: 'flat',
      aR: { d1: loc(0, -1, 78, 0.08), d2: loc(0, -1, 78, 0.06) }, aL: { d1: [0.2, -0.5, -1], d2: [0.3, -0.4, -1] } });
    return { anim: { keys: [top, bot], seq: rep(2, 1.3) }, props: { db: 'R', dbAxis: 'lat' }, cam: [20, 10] };
  };

  G.goodMorning = () => {
    const arms = { aR: { ik: [-8, 34.5, 40], f: 'c', pole: [-0.6, -1, 0.35] } };
    const legs = { lR: { ik: [0, ANK, 15], pole: [1, 0, 0.15] }, toe: 8 };
    const top = P({ P: [0, 91, 0], ...arms, ...legs });
    const bot = P({ P: [-26, 86, 0], pel: [76, 0, 0], ch: [-3, 0, 0], hd: [-50, 0, 0], ...arms, ...legs });
    return { anim: { keys: [top, bot], seq: rep(2.2, 1.3) }, props: { bar: {} }, cam: [16, 10] };
  };

  G.hipThrust = () => {
    const B = [-34, 47];
    const mk = (Pp) => P({ P: [Pp[0], Pp[1], 0], pel: [spineTo(Pp, B), 0, 0], hd: [26, 0, 0], lR: { ik: [44, ANK, 17], pole: [1, 0, 0.3] }, f: 'flat', toe: 10, aR: { ik: [16, 6, 30], f: 'p', pole: [-0.3, 1, 0.4] } });
    return { anim: { keys: [mk([4, 25]), mk([10, 52])], seq: lift(1, 1.6, 0.6, 0.3) }, props: { bar: { at: [17, 1, 0], f: 'p' } }, stat: [box([-50, 22, 0], [34, 44, 120], { top: PAD, side: PADS })], cam: [26, 16] };
  };

  G.bridge = () => {
    const B = [-40, 12];
    const mk = (Pp) => P({ P: [Pp[0], Pp[1], 0], pel: [spineTo(Pp, B), 0, 0], hd: [8, 0, 0], lR: { ik: [36, ANK, 15], pole: [1, 0, 0.2] }, f: 'flat', toe: 8, aR: { ik: [-6, 4, 27], pole: [0, 1, 0.5] } });
    return { anim: { keys: [mk([4, 13]), mk([8, 38])], seq: lift(1, 1.5, 0.7, 0.3) }, props: {}, stat: [mat(-90, 70)], cam: [26, 16] };
  };

  G.kbSwing = () => {
    const legs = { lR: { ik: [2, ANK, 20], pole: [1, 0, 0.35] }, toe: 12 };
    const k0 = P({ P: [-22, 82, 0], pel: [62, 0, 0], ch: [-2, 0, 0], hd: [-42, 0, 0], ...legs, aR: { d1: [0.58, -0.82, -0.2], d2: [0.55, -0.84, -0.22] } });
    const k1 = P({ P: [0, 91.2, 0], pel: [-4, 0, 0], ...legs, aR: { d1: [1, 0.04, -0.27], d2: [1, 0.08, -0.22] } });
    return { anim: { keys: [k0, k1], seq: [{ to: 1, t: 0.6, ph: 'con', e: 'o' }, { to: 1, t: 0.18, ph: 'hold' }, { to: 0, t: 0.7, ph: 'ecc', e: 'i' }, { to: 0, t: 0.12, ph: 'hold' }] }, props: { kb: 'both' }, cam: [20, 8], thumbT: 0.05 };
  };

  G.gluteKick = () => {
    const base_ = { P: [-6, 90, 0], pel: [28, 0, 0], hd: [-20, 0, 0], lL: { ik: [6, ANK, -10], pole: [1, 0, -0.05] }, fL: 'flat', aR: { ik: [44, 122, 10], pole: [0, -1, 0.5] }, fR: { rel: 10 } };
    const k0 = P({ ...base_, lR: { d1: [0.12, -1, 0.04], d2: [0.06, -1, 0.03] } });
    const k1 = P({ ...base_, lR: { d1: [-0.8, -0.6, 0.04], d2: [-0.82, -0.57, 0.03] } });
    return { anim: { keys: [k0, k1], seq: lift(0.9, 1.5) }, props: { cables: [{ from: [48, 14, 10], to: 'ankle' }] }, stat: [column(55, 10)], cam: [18, 8] };
  };

  G.calfRaise = (o = {}) => {
    if (o.seated) {
      const k = (ay, fp) => P({ P: [0, 51, 0], pel: [4, 0, 0], lR: { ik: [40, ay, 12], pole: [1, 0.3, 0.1] }, f: fp, toe: 6, aR: { ik: [36, 66, 18], pole: [0, -1, 0.5] } });
      return { anim: { keys: [k(ANK, 0), k(ANK + 8.5, 40)], seq: lift(0.9, 1.6, 0.6, 0.4) }, props: { pads: [{ at: 'thighs', side: 'front', w: 16, r: 5 }] }, stat: [box([-4, 41, 0], [38, 8, 34], { top: PAD, side: PADS }), box([-4, 18, 0], [10, 37, 20])], cam: [-28, 10] };
    }
    const arms = { aR: { d1: [0.02, -1, 0.16], d2: [0.02, -1, 0.14] } };
    const k0 = P({ lR: { ik: [0, ANK, 12] }, f: 0, toe: 6, ...arms });
    const k1 = P({ P: [4.6, 100.4, 0], lR: { ik: [5, 16, 12] }, f: 42, toe: 6, ...arms });
    return { anim: { keys: [k0, k1], seq: lift(0.9, 1.6, 0.6, 0.4) }, props: CH, cam: [-142, 8] };
  };

  /* ======================= CHEST ======================= */
  G.bench = (o = {}) => {
    const inc = o.incline || 0, db = o.db;
    const grip = o.grip || (db ? 24 : 27);
    const hx = inc > 10 ? 4 : 12;
    const spine = -90 + inc;
    const Py = inc > 10 ? 50 : 56.6;
    const Pp = [hx, Py, 0];
    const sh = chestPt(Pp, spine, 0, [-1, 32]);
    const touch = chestPt(Pp, spine, 0, [14.5, inc > 10 ? 27 : 21]);
    const lockW = [sh[0] + (inc > 10 ? 3 : 1), sh[1] + 58];
    const legs = inc < -5
      ? { lR: { ik: [hx + 46, Py - 24, 11], pole: [1, 0.4, 0.1] }, f: { rel: 20 } }
      : inc > 10 ? { lR: { ik: [hx + 40, ANK, 22], pole: [1, 0, 0.3] }, f: 'flat', toe: 16 }
        : { lR: { ik: [hx + 38, ANK, 23], pole: [1, 0, 0.35] }, f: 'flat', toe: 18 };
    const pole = o.close ? [-0.8, -0.7, 0.22] : [-0.7, -0.5, 0.62];
    const zg = db ? grip + 2 : grip;
    const k = (tg) => P({ P: Pp, pel: [spine, 0, 0], hd: [inc < -5 ? 0 : inc > 10 ? 4 : 10, 0, 0], ...legs, aR: { ik: tg, pole } });
    const k0 = k([lockW[0], lockW[1], db ? 15 : zg]);
    const k1 = k([touch[0], touch[1] + (db ? 0 : 1.5), zg + (db ? 7 : 0)]);
    let stat;
    if (inc > 10) stat = seatBack(hx, 90 - inc, 44, 84);
    else if (inc < -5) stat = [{ t: 'box', c: [-14, 52, 0], s: [116, 8, 28], e: [inc, 0, 0], top: PAD, side: PADS }, box([-50, 22, 0], [6, 44, 20]), box([30, 28, 0], [6, 56, 20]), { t: 'bar', a: [hx + 50, Py - 20, -18], b: [hx + 50, Py - 20, 18], r: 4.5 }, { t: 'bar', a: [hx + 34, Py + 6, -18], b: [hx + 34, Py + 6, 18], r: 4.5 }];
    else stat = bench(-62, 42, 45);
    return { anim: { keys: [k0, k1], seq: rep(o.ecc || 2, o.con || 1.1) }, props: db ? { db: true, dbAxis: 'lat' } : { bar: {} }, stat, cam: [28, 26] };
  };

  G.fly = () => {
    const base_ = { P: [12, 56.6, 0], pel: [-90, 0, 0], hd: [10, 0, 0], lR: { ik: [50, ANK, 23], pole: [1, 0, 0.35] }, f: 'flat', toe: 18 };

      return `<div class="bar"><span class="lbl">${esc(g.n)}</span><span class="track">${g.lo ? `<span class="band" style="left:${lo / max * 100}%;width:${(hi - lo) / max * 100}%"></span>` : ''}<span class="fill" style="width:${Math.min(100, s / max * 100)}%"></span></span><span class="val">${C.fmtSets(s)}${ic}</span></div>`;

  function bindReorder(list, dayIdx) {
    if (!list) return;
    let drag = null;
    list.addEventListener('pointerdown', e => {
      const h = e.target.closest('[data-handle]'); if (!h) return;
      const row = h.closest('.li'); const rows = [...list.querySelectorAll('.li')];
      drag = { row, from: rows.indexOf(row), y0: e.clientY, rows, rects: rows.map(r => r.getBoundingClientRect()) };
      row.classList.add('dragging'); h.setPointerCapture(e.pointerId); U.buzz(8); e.preventDefault();
    });
    list.addEventListener('pointermove', e => {
      if (!drag) return; const dy = e.clientY - drag.y0; drag.row.style.transform = `translateY(${dy}px)`;
      const cy = drag.rects[drag.from].top + drag.rects[drag.from].height / 2 + dy;
      let to = drag.rects.filter((r, i) => i !== drag.from && r.top + r.height / 2 < cy).length; to = Math.max(0, Math.min(drag.rects.length - 1, to)); drag.to = to;
      drag.rows.forEach((r, i) => { if (r === drag.row) return; let off = 0; const hgt = drag.rects[drag.from].height; if (drag.from < to && i > drag.from && i <= to) off = -hgt; if (drag.from > to && i < drag.from && i >= to) off = hgt; r.style.transform = off ? `translateY(${off}px)` : ''; r.style.transition = 'transform .15s'; });
    });
    const end = () => {
      if (!drag) return; const { from, to } = drag; drag.rows.forEach(r => { r.style.transform = ''; r.style.transition = ''; }); drag.row.classList.remove('dragging');
      drag = null;
      if (to != null && to !== from) { const items = plan().days[dayIdx].items; const [m] = items.splice(from, 1); items.splice(to, 0, m); commit(); U.buzz(10); }
    };

  function applyTheme() {
    const t = P().theme; const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#1b1e23' : '#eceeea');
  }
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (P().theme === 'system') applyTheme(); }); } catch (e) { }
  return { open, method, applyTheme };
})();

/* ---------------------------- ONBOARDING ---------------------------- */
const Onboard = (() => {
  'use strict';
  const C = Core, S = U.S, P = U.P;
  const { esc, icon } = U;
  let step = 0, pg = null, heroPl = null, heroI = 0;
  const st = { split: 'ul', days: 4, custom: [{ name: 'Day 1', parts: ['chest', 'triceps'] }, { name: 'Day 2', parts: ['back', 'biceps'] }, { name: 'Day 3', parts: ['quads', 'hamstrings', 'calves'] }] };
  function open(rerun) {
    step = 0;
    const el = document.createElement('div');
    pg = U.page({ title: '', body: el, up: true, cls: 'onboard', onClose: () => { clearInterval(heroI); heroPl && heroPl.destroy(); heroPl = null; if (!P().onboarded) { P().onboarded = true; C.save(); } } });
    pg.el.querySelector('.pg-h').style.display = 'none';
    pg.el.querySelector('.pg-b').style.padding = '0';
    draw();
  }
  function draw() {
    const p = P(); const el = pg.el.querySelector('.pg-b');
    clearInterval(heroI); if (heroPl) { heroPl.destroy(); heroPl = null; }
    const dots = `<div class="progress-dots">${[1, 2, 3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;
    if (step === 0) {
      el.innerHTML = `<div class="ob"><div class="ob-hero"><canvas aria-label="A 3D figure demonstrating exercises"></canvas></div><div class="ob-body">
        <h1>Your pocket spotter.</h1><p class="lead">A plan built around your split, equipment and time. Every exercise has a 3D demo, a form checklist and safety notes. Every set you log adds to your progress.</p>
        <div style="margin-top:auto;display:grid;gap:8px"><button class="btn primary big block" data-go="1">Set up my plan</button><button class="btn ghost block" data-skip>Look around first</button></div></div></div>`;
      const cv = el.querySelector('canvas');
      heroPl = new Rig.Player(cv, { interactive: true });
      const demo = ['bb-squat', 'pullup', 'bb-bench', 'db-lateral', 'deadlift', 'pushup'].map(id => C.byId[id]).filter(Boolean);
      let k = 0; heroPl.load(demo[0]);
      heroI = setInterval(() => { k = (k + 1) % demo.length; heroPl.load(demo[k]); }, 5200);
    } else if (step === 1) {
      el.innerHTML = `<div class="ob"><div class="ob-body">${dots}<h1 style="font-size:40px">About you</h1><p class="lead">Used to estimate the calories you burn and your body composition. It stays on this phone.</p>
        <label class="field"><span>Your name (optional)</span><input class="input" id="nm" value="${esc(p.name)}" maxlength="30" autocomplete="given-name"/></label>
        <div class="field"><span>Sex</span><div class="seg"><button data-sx="m" aria-pressed="${p.sex === 'm'}">Male</button><button data-sx="f" aria-pressed="${p.sex === 'f'}">Female</button></div></div>
        <div class="grid2"><label class="field"><span>Age</span>${U.stepper('age', p.age, { min: 14, max: 99, int: true })}</label><label class="field"><span>Height</span>${U.stepper('height', U.r1(U.toL(p.height)), { min: 40, max: 250, step: U.lenU() === 'cm' ? 1 : 0.5, unit: U.lenU() })}</label></div>
        <label class="field"><span>Weight</span>${U.stepper('weight', U.r1(U.toW(p.weight)), { min: 20, max: 700, step: 0.5, unit: U.wU() })}</label>
        <div class="field"><span>Units</span><div class="seg"><button data-un="metric" aria-pressed="${p.units === 'kg'}">kg, cm</button><button data-un="mixed" aria-pressed="${p.units === 'kg' && p.len === 'in'}">kg, inches</button><button data-un="imp" aria-pressed="${p.units === 'lb'}">lb, inches</button></div></div>
        <div style="margin-top:auto;display:flex;gap:10px;padding-top:10px"><button class="btn" data-go="0" aria-label="Back">${icon('back', 'sm')}</button><button class="btn primary big grow" data-go="2">Continue</button></div></div></div>`;
      el.querySelectorAll('[data-un]').forEach(b => { const on = b.dataset.un === 'metric' ? (p.units === 'kg' && p.len === 'cm') : b.dataset.un === 'mixed' ? (p.units === 'kg' && p.len === 'in') : p.units === 'lb'; b.setAttribute('aria-pressed', on); });
      U.bindSteppers(el, (k, v) => { if (k === 'age') p.age = v; if (k === 'height') p.height = Math.round(U.fromL(v) * 10) / 10; if (k === 'weight') p.weight = Math.round(U.fromW(v) * 10) / 10; C.save(); });
      el.querySelector('#nm').oninput = e => { p.name = e.target.value; C.save(); };
      el.querySelectorAll('[data-sx]').forEach(b => b.onclick = () => { p.sex = b.dataset.sx; C.save(); draw(); });
      el.querySelectorAll('[data-un]').forEach(b => b.onclick = () => { const u = b.dataset.un; p.units = u === 'imp' ? 'lb' : 'kg'; p.len = u === 'metric' ? 'cm' : 'in'; C.save(); draw(); });
    } else if (step === 2) {
      el.innerHTML = `<div class="ob"><div class="ob-body">${dots}<h1 style="font-size:40px">Your training</h1><p class="lead">These decide how many sets, reps and exercises each day gets.</p>
        <div class="field"><span>Main goal</span><div class="opts">${Object.entries(C.GOALS).map(([k, l]) => `<button class="opt" data-g="${k}" aria-pressed="${p.goal === k}"><div class="grow"><div class="t">${l}</div><div class="s">${{ muscle: '6–15 reps, about 10–20 sets per muscle a week', strength: 'Heavy sets of 3–6 reps with longer rests', fatloss: 'Higher reps and short rests to keep you moving', general: 'A balanced mix of strength and fitness' }[k]}</div></div><span class="tick">${p.goal === k ? icon('check', 'xs') : ''}</span></button>`).join('')}</div></div>
        <div class="field"><span>Experience</span><div class="seg"><button data-lv="1" aria-pressed="${p.level === 1}">Beginner</button><button data-lv="2" aria-pressed="${p.level === 2}">Intermediate</button><button data-lv="3" aria-pressed="${p.level === 3}">Advanced</button></div></div>
        <div class="field"><span>Time per session</span><div class="seg">${[30, 45, 60, 75, 90].map(m => `<button data-sm="${m}" aria-pressed="${p.sessionMin === m}">${m} min</button>`).join('')}</div></div>
        <div class="field"><span>Where you train</span><div class="opts">${Object.entries(C.EQ_PRESETS).map(([k, v]) => `<button class="opt" data-eq="${k}" aria-pressed="${p.eqPreset === k}"><div class="grow"><div class="t">${v.n}</div><div class="s">${{ gym: 'Barbells, dumbbells, cables and machines', home: 'Dumbbells, kettlebell, bench and pull-up bar', db: 'A pair of dumbbells and a bench', bw: 'Floor, a sturdy chair or step' }[k]}</div></div><span class="tick">${p.eqPreset === k ? icon('check', 'xs') : ''}</span></button>`).join('')}</div></div>
        <div style="margin-top:auto;display:flex;gap:10px;padding-top:10px"><button class="btn" data-go="1" aria-label="Back">${icon('back', 'sm')}</button><button class="btn primary big grow" data-go="3">Continue</button></div></div></div>`;
      el.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { p.goal = b.dataset.g; C.save(); draw(); });
      el.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { p.level = +b.dataset.lv; C.save(); draw(); });
      el.querySelectorAll('[data-sm]').forEach(b => b.onclick = () => { p.sessionMin = +b.dataset.sm; C.save(); draw(); });
      el.querySelectorAll('[data-eq]').forEach(b => b.onclick = () => { p.eqPreset = b.dataset.eq; p.equip = C.EQ_PRESETS[b.dataset.eq].eq.slice(); C.save(); draw(); });
    } else {
      el.innerHTML = `<div class="ob"><div class="ob-body">${dots}<h1 style="font-size:40px">Pick your split</h1><p class="lead" style="margin-bottom:12px">How your week is divided. Switch any time, and edit every exercise afterwards.</p><div id="spl"></div>
        <div style="position:sticky;bottom:0;background:var(--bg);display:flex;gap:10px;padding:12px 0 calc(6px + var(--safe-b))"><button class="btn" data-go="2" aria-label="Back">${icon('back', 'sm')}</button><button class="btn primary big grow" data-build>Build my plan</button></div></div></div>`;
      const box = el.querySelector('#spl');
      const drawS = () => { box.innerHTML = App.SplitSetup.html(st); box.querySelectorAll('[data-split]').forEach(b => b.onclick = () => { st.split = b.dataset.split; const s = C.SPLITS.find(x => x.id === st.split); if (s.days && !s.days[st.days]) st.days = +Object.keys(s.days).sort((a, b) => Math.abs(a - 4) - Math.abs(b - 4))[0]; drawS(); }); box.querySelectorAll('[data-nd]').forEach(b => b.onclick = e => { e.stopPropagation(); st.split = b.dataset.s; st.days = +b.dataset.nd; drawS(); }); App.SplitSetup.bindCustom(box, st, drawS); };
      drawS();
      el.querySelector('[data-build]').onclick = () => { App.SplitSetup.build(st); P().onboarded = true; C.save(); pg.close(); S().ui.planDay = 0; App.go('plan'); setTimeout(() => U.toast('Your plan is ready. Tap any exercise to adjust it.'), 400); };
    }
    el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { step = +b.dataset.go; draw(); el.scrollTop = 0; pg.el.querySelector('.pg-b').scrollTop = 0; });
    const sk = el.querySelector('[data-skip]'); if (sk) sk.onclick = () => { P().onboarded = true; C.save(); pg.close(); App.go('library'); };
  }
  return { open };
})();

/* ---------------------------- BOOT ---------------------------- */
(function boot() {
  'use strict';
  Core.load();
  Settings.applyTheme();
  const tabs = [['today', 'home', 'Today'], ['plan', 'plan', 'Plan'], ['library', 'library', 'Library'], ['progress', 'progress', 'Progress']];
  document.getElementById('tabbar').innerHTML = tabs.map(([k, ic, l]) => `<button class="tab" data-tab="${k}">${U.icon(ic)}<span>${l}</span></button>`).join('');
  document.getElementById('tabbar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; U.buzz(6); if (U.topOverlay()) U.closeAll(); App.go(b.dataset.tab); });
  const h = (location.hash || '#today').slice(1);
  try { history.replaceState({ ov: 0 }, '', location.pathname + location.search + '#' + h); } catch (e) { }
  App.go(h);
  if (!Core.state().profile.onboarded) Onboard.open();
  if (Core.state().active) Sess.syncRest();
  if (!Core.storageOK()) setTimeout(() => U.toast('This browser is blocking storage, so changes won’t be kept after you close the page.', 'Got it'), 1200);
  // offline support when hosted (GitHub Pages)
  if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
  }
})();

</script>
</body>
